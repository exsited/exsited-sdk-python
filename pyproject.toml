[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exsited"
version = "4.0.2"
description = "Python SDK for the Exsited v4 REST API."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ashiq Rahman", email = "ashiq@webalive.com.au" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["exsited", "billing", "subscription", "sdk", "rest", "api-client", "oauth2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.4",
    "urllib3>=1.21.1",
    "portalocker>=2.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "python-dotenv>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyrefly>=0.60.0",
    "ruff>=0.14.6,<0.15",
]

[dependency-groups]
test = ["pytest>=8.0.0", "python-dotenv>=1.0.0"]
dev = [
    { include-group = "test" },
    "pyrefly>=0.60.0",
    "ruff>=0.14.6,<0.15",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
exclude = ["exsited/auth/*", "exsited/config/auth_config.py"]

[tool.ruff.lint.isort]
known-first-party = ["exsited", "tests"]

[tool.setuptools.packages.find]
include = ["exsited*"]

[tool.setuptools.package-data]
exsited = ["py.typed"]
